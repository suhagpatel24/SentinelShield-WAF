{% extends "base.html" %}{% block content %}<div class="wrap"><h1>Search</h1><form class="toolbar" method="get"><input class="input" name="q" value="{{query}}" placeholder="Search incidents"><button>Search</button></form><div class="card" style="margin-top:16px"><table><tr><th>Time</th><th>IP</th><th>Attack</th><th>Severity</th><th>URL</th></tr>{% for r in incidents %}<tr><td>{{r.timestamp}}</td><td>{{r.ip_address}}</td><td>{{r.attack_type}}</td><td>{{r.severity}}</td><td>{{r.url}}</td></tr>{% else %}<tr><td colspan="5" class="muted">No results.</td></tr>{% endfor %}</table></div></div>{% endblock %}
